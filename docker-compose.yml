# docker compose up --build
#   frontend → http://localhost:5173   (calls the Java API)
#   API      → http://localhost:8080/api/stations   Swagger → http://localhost:8080/swagger-ui.html
services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      METRO_TRANSFER_MINUTES: "5"
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [api]
