spring.application.name=metro-route-planner
server.port=${PORT:8080}

# Walk + wait cost of changing lines, in minutes
metro.transfer-minutes=5
# Comma-separated allowed browser origins for the API
metro.cors-origins=*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.mvc.problemdetails.enabled=true
